[package]
authors = ["Pravin Paratey"]
description = "A console version of the popular wordle game"
edition = "2021"
name = "cwordle"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
owo-colors = "3.2.0"
rand = "0.8.4"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"

[dependencies.pancurses]
features = ["win32"]
version = "0.17"

[lib]
name = "cwordle"
path = "src/lib.rs"
